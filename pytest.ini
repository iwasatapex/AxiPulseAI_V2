[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --maxfail=5
# Scoped filter for the 3 cosmetic SHAP PendingDeprecationWarnings emitted
# inside the installed SHAP dependency (shap/plots/colors/_colors.py) at
# import time (set_bad/set_over/set_under on the red_blue colormap).
# This is dependency-only; it is intentionally limited to the SHAP
# matplotlib-colormap module and category and does not suppress warnings
# elsewhere.
filterwarnings =
    ignore::PendingDeprecationWarning:.*shap\.plots\.colors\._colors
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    v3: ADIE V3 tests
norecursedirs =
    .git
    .tox
    .venv
    venv
    __pycache__
    backups
    archive
    .pytest_cache
    core/forecast_ai/tests
    core/nps_predictor/tests
    core/operation_health_predictor/tests
    core/decision_intelligence/v2
    core/decision_intelligence/v3
    dashboard
    load_tests
    performance
    deployment
    release
    project/backups
    project/archive
    project/dashboard
    project/load_tests
    project/performance
    project/deployment
    project/release
    project/core/decision_intelligence/v2
    project/core/decision_intelligence/v3
    project/core/forecast_ai/tests
    project/core/nps_predictor/tests
    project/core/operation_health_predictor/tests
    project/cli
    project/core/forecast_ai
    project/core/nps_predictor
    project/core/operation_health_predictor
    project/core/target_state_engine
