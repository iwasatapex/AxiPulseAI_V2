name: AxiPulseAI CI

on:

  push:

    branches:
      - master

  pull_request:


jobs:

  test:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.13"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Compile check
        run: |
          python -m compileall api core


      - name: Validate project/runtime contract consistency
        run: |
          python - <<'PY'
          import sys, tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text("utf-8"))
          requires = pyproject["project"].get("requires-python", "")

          major, minor = sys.version_info[:2]
          runtime = f"{major}.{minor}"
          if requires and runtime not in requires:
              raise SystemExit(
                  f"CI Python {runtime} does not satisfy requires-python "
                  f"{requires!r} from pyproject.toml."
              )

          # The active default/production branch is master; CI must not
          # silently target a stale branch name.
          for path in Path(".github/workflows").glob("*.yml"):
              text = path.read_text("utf-8")
              if "main" in text and "master" not in text:
                  print(f"WARN: {path.name} references 'main' without 'master'")

          print(f"PROJECT CONTRACT OK: python {runtime} satisfies {requires}")
          PY


      - name: API validation
        run: |
          python - <<'PY'
          from api.main import app

          assert app.title == "AxiPulseAI API"

          print("API LOAD PASS")
          PY


      - name: Production model integrity validation (fail closed)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from core.forecast_ai.prediction import predictor_config as pc
          from core.forecast_ai.prediction import production_registry as pr

          MODELS = Path("models")
          # Documented canonical production source family. This is the verified
          # provenance of the active production generation (reconciled with the
          # actual promoted artifacts); CI fails closed on any mismatch.
          EXPECTED_SOURCE = "100k-10yr"

          # 1. Canonical artifact paths must exist AND resolve (a broken symlink
          #    or missing file is a hard failure, never a skipped warning).
          canonical = {
              "production_OH.pkl": True,
              "production_NPS.pkl": False,
          }
          for name, is_oh in canonical.items():
              p = MODELS / name
              if not p.exists():
                  raise SystemExit(f"FAIL: canonical model {name} missing/broken")
              if p.is_symlink() and not p.resolve().exists():
                  raise SystemExit(f"FAIL: canonical model {name} is a broken symlink")
              if not p.is_file():
                  raise SystemExit(f"FAIL: canonical model {name} is not a regular file")

          # 2. Manifest must exist and resolve.
          manifest = MODELS / "manifest.json"
          if not manifest.exists() or not manifest.is_file():
              raise SystemExit("FAIL: production manifest.json missing/broken")

          # 3. Fail-closed artifact integrity (hash / role / provenance /
          #    trained-state / feature-count / feature schema / output-count).
          for name, is_oh in canonical.items():
              pc.verify_production_artifact(MODELS / name, is_oh=is_oh)
              print(f"PRODUCTION INTEGRITY OK: {name}")

          # 4. Active generation provenance must match the documented contract.
          active = pr.active_generation_dir(MODELS)
          if active is None:
              raise SystemExit("FAIL: no active production generation (current pointer missing/broken)")
          m = json.loads((active / pr.MANIFEST_NAME).read_text(encoding="utf-8"))
          for name in ("production_OH.pkl", "production_NPS.pkl"):
              src = (m.get(name) or {}).get("source")
              if src != EXPECTED_SOURCE:
                  raise SystemExit(
                      f"FAIL: production provenance mismatch for {name}: "
                      f"expected source={EXPECTED_SOURCE!r}, got {src!r}"
                  )
          print(f"PROVENANCE OK: active generation {active.name}, source={EXPECTED_SOURCE!r}")
          print("PRODUCTION INTEGRITY VALIDATION PASSED (fail-closed)")
          PY


      - name: Run test suite
        run: |
          pip install pytest
          pytest -q
