name: AxiPulseAI CI

on:

  push:

    branches:
      - main

  pull_request:


jobs:

  test:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.14"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Compile check
        run: |
          python -m compileall api core


      - name: API validation
        run: |
          python - <<'PY'
          from api.main import app

          assert app.title == "AxiPulseAI API"

          print("API LOAD PASS")
          PY
